<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - E-commerce Store</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header>
        <h1>E-commerce Store</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
        </nav>
        <div id="user-info"></div>
    </header>
    
    <main>
        <div class="checkout-container" style="display: flex; gap: 2rem; max-width: 1200px; margin: 0 auto;">
            <div class="form-container" style="flex: 2;">
                <h2>Checkout</h2>
                
                <form id="checkout-form">
                    <h3>Shipping Information</h3>
                    
                    <div class="form-group">
                        <label for="address">Address</label>
                        <input type="text" id="address" name="address" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="city">City</label>
                        <input type="text" id="city" name="city" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="postalCode">Postal Code</label>
                        <input type="text" id="postalCode" name="postalCode" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="country">Country</label>
                        <input type="text" id="country" name="country" required>
                    </div>
                    
                    <h3>Payment Method</h3>
                    
                    <div class="form-group">
                        <div>
                            <input type="radio" id="paypal" name="paymentMethod" value="PayPal" checked>
                            <label for="paypal">PayPal</label>
                        </div>
                        
                        <div>
                            <input type="radio" id="credit-card" name="paymentMethod" value="CreditCard">
                            <label for="credit-card">Credit Card</label>
                        </div>
                    </div>
                    
                    <button type="submit" class="form-btn">Place Order</button>
                </form>
            </div>
            
            <div id="order-summary" class="form-container" style="flex: 1;">
                <h2>Order Summary</h2>
                
                <ul id="summary-items">
                    <!-- Order items will be loaded dynamically -->
                </ul>
                
                <div style="display: flex; justify-content: space-between; font-weight: bold; margin-top: 1rem;">
                    <span>Total:</span>
                    <span id="summary-total">$0.00</span>
                </div>
            </div>
        </div>
    </main>
    
    <footer>
        <p>&copy; 2024 E-commerce Store. All rights reserved.</p>
    </footer>
    
    <script src="js/script.js"></script>
</body>
</html>
